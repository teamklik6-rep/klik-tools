<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flux Studio — градієнтні фони / рифлене скло</title>
<link rel="stylesheet" href="studio.css">
<style>
  .tabs{grid-template-columns:repeat(5,1fr)}
  .presets.c5{grid-template-columns:repeat(5,1fr)}
  .presets.c5 .preset{padding:8px 2px}
  .prm .row{margin-top:12px}
  .group h2 + .prm .row{margin-top:0}
  .prm.off{display:none}
  .seg-lbl{font-size:13px;font-weight:500;margin:12px 0 7px}
  .group h2 + .prm .seg-lbl{margin-top:0}
  .sub-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:hsl(var(--muted-foreground));margin:16px 0 10px;font-weight:600}
  .presets.thumbs{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .preset.tile{padding:4px 4px 6px;display:flex;flex-direction:column;gap:5px;font-size:11px;line-height:1.15;text-align:left}
  .preset.tile canvas{display:block;width:100%;aspect-ratio:16/10;border-radius:5px;background:hsl(var(--muted))}
  .preset.tile span{padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .preset.sw{padding:7px 6px 8px;font-size:11px}
  .preset.sw .pal{height:12px}
  .colors.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .colors.c3 .color-wrap{padding:5px 6px;gap:5px;min-width:0}
  .color-wrap .hex{font-size:10.5px;overflow:hidden;white-space:nowrap}
  .presets.thumbs{grid-template-columns:repeat(3,minmax(0,1fr))}
  #coloramaBox{transition:opacity .15s}
  .mode-hint{margin-top:10px}
  #out{cursor:crosshair}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/><path d="M2 18c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/><path d="M2 6c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/></svg>
      </div>
      <div><h1>Flux Studio</h1><p>градієнтні фони · рифлене скло · GPU</p></div>
    </div>
    <div class="head-actions">
      <button class="btn" id="btnShuffle" title="Інший seed: позиції плям, зсуви панелей, пил">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        Перемішати
      </button>
      <button class="btn primary" id="btnRand" title="Новий випадковий градієнт: джерело, палітра, скло">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/></svg>
        Згенерувати
      </button>
    </div>
  </header>

  <main>
    <aside class="card panel">
      <div class="group" id="presetGroups"></div>

      <div class="tabs">
        <div class="tab active" data-tab="source">Джерело</div>
        <div class="tab" data-tab="glass">Скло</div>
        <div class="tab" data-tab="waves">Хвилі</div>
        <div class="tab" data-tab="color">Колір</div>
        <div class="tab" data-tab="export">Експорт</div>
      </div>

      <div data-pane="source" class="active"></div>
      <div data-pane="glass"></div>
      <div data-pane="waves"></div>
      <div data-pane="color"></div>
      <div data-pane="export"></div>
    </aside>

    <section class="workspace">
      <div class="card stage" id="stage">
        <canvas id="out"></canvas>
        <div class="stage-bar">
          <div class="iconbtn" id="playBtn" title="Пауза / відтворення">
            <svg id="icoPause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="5" x2="9" y2="19"/><line x1="15" y1="5" x2="15" y2="19"/></svg>
            <svg id="icoPlay" class="hide" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <span class="badge"><span class="dot" id="statusDot"></span> <span id="statusTxt">Готово</span></span>
          <span class="spacer"></span><span class="dims" id="dims"></span>
        </div>
      </div>
    </section>
  </main>
  <footer>один файл · WebGL2 (GPU) у браузері · mosta noise → рифлене скло → растр · безшовні лупи · лише фон, без тексту</footer>
</div>
<script src="mp4-muxer.js"></script>

  const VS=`#version 300 es

precision highp float;

uniform vec3 u_bg,u_c0,u_c1,u_c2,u_c3,u_c4;

${FKEYS.map(k=>"uniform float u_"+k+";").join("\n")}
${IKEYS.map(k=>"uniform int u_"+k+";").join("\n")}
uniform int u_colorama;
uniform sampler2D u_pal;
out vec4 outColor;

const float TAU=6.28318530718;
const float PI=3.14159265359;
vec2 ASP;
#define ROTM(a) mat2(cos(a),-sin(a),sin(a),cos(a))

float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
mat2 rot2(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float h11(float x){return fract(sin(x*127.1+u_seed*7.13)*43758.5453);}
float vn1(float x){float i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);return mix(h11(i),h11(i+1.0),f);}

vec3 pickCol(int i){
  if(i==0)return u_c0; if(i==1)return u_c1; if(i==2)return u_c2; if(i==3)return u_c3; return u_c4;
}
vec3 pal5(float t){
  t=clamp(t,0.0,1.0)*4.0;
  vec3 c=u_c0;
  c=mix(c,u_c1,clamp(t,0.0,1.0));
  c=mix(c,u_c2,clamp(t-1.0,0.0,1.0));
  c=mix(c,u_c3,clamp(t-2.0,0.0,1.0));
  c=mix(c,u_c4,clamp(t-3.0,0.0,1.0));
  return c;
}

/* ---- mosta.io: value noise, зациклений по часу (період = u_mCycles) ---- */
float hz(vec3 i){ i.z=mod(i.z,u_mCycles); return fract(sin(dot(i,vec3(7.0,157.0,113.0)))*43758.5); }
float noiseP(vec3 p){
  vec3 i=floor(p), f=p-i; f=f*f*(3.0-2.0*f);
  float a=mix(hz(i),hz(i+vec3(1,0,0)),f.x);
  float b=mix(hz(i+vec3(0,1,0)),hz(i+vec3(1,1,0)),f.x);
  float c=mix(hz(i+vec3(0,0,1)),hz(i+vec3(1,0,1)),f.x);
  float d=mix(hz(i+vec3(0,1,1)),hz(i+vec3(1,1,1)),f.x);
  return mix(mix(a,b,f.y),mix(c,d,f.y),f.z);
}
vec3 lin(vec3 c){return pow(max(c,vec3(0.0)),vec3(2.2));}
vec3 blendM(vec3 base,vec3 c,float op){
  if(u_mBlend==0) return base*mix(vec3(1.0),c,op);       /* multiply (світле) */
  return 1.0-(1.0-base)*(1.0-c*op*0.7);                   /* screen (темне)   */
}
vec3 mostaField(vec2 p,vec2 stS){
  vec2 uv=p/0.75;                         /* одиниці сайту: коротка сторона ±1 */
  float T=u_t*u_mCycles;
  uv*=u_mScale;
  uv.x/=max(u_mStretch,0.5);
  uv+=vec2(11.3+fract(u_seed*0.137)*37.0,5.7+fract(u_seed*0.291)*29.0);
  float n=noiseP(vec3(uv*ROTM(PI/4.0),T-1.4*uv.x));
  uv.y+=8.0*u_mDisp*n;
  float x=noiseP(vec3(uv*ROTM(PI/4.0),T-0.4*uv.x));
  float y=noiseP(vec3(uv*ROTM(PI/4.0),-T-0.4*uv.x));
  vec2 q=vec2(x,y);
  vec3 col=lin(u_bg);
  col=blendM(col,lin(u_c0),smoothstep(0.0,1.0,1.0-length((q-0.5+vec2(-1.3,1.0)*0.3)*0.9)));
  col=blendM(col,lin(u_c1),smoothstep(0.0,1.0,1.0-length((q-0.5-vec2(-1.3,1.0)*0.3)*0.9)));
  if(u_mC3>0.001) col=blendM(col,lin(u_c2),u_mC3*smoothstep(0.0,1.0,1.0-length((q-0.5)*2.2)));
  col=pow(col,vec3(1.0/2.2));
  float yy=1.0-clamp(stS.y,0.0,1.0), mask=1.0;   /* як на сайті: «Верх» = колір угорі */
  if(u_mMask==1) mask=1.0-yy;
  else if(u_mMask==2) mask=yy;
  else if(u_mMask==3) mask=1.0-smoothstep(0.0,1.0,abs(yy*2.0-1.0));
  else if(u_mMask==4){
    vec2 uc=(stS*2.0-1.0)*vec2(ASP.x/ASP.y,1.0); uc.y-=1.0;
    mask=1.0-smoothstep(1.45,2.0,length(uc));
    mask*=clamp((1.0-yy)*4.0,0.0,1.0);
  }
  return mix(u_bg,col,mask);
}

/* ---- лінза (Seed 1.8): світла куля, хроматичний обід, кільця, пил ---- */
vec3 lensRamp(float x,vec3 inner){
  vec3 c=inner;
  c=mix(c,min(inner*1.04+0.04,vec3(1.0)),smoothstep(-1.0,0.0,x)*0.5);
  c=mix(c,u_c3,smoothstep(-0.35,0.15,x));
  c=mix(c,u_c0,smoothstep(0.05,0.45,x));
  c=mix(c,u_bg,smoothstep(0.4,1.0,x));
  c+=u_c2*exp(-pow((x-1.25)/0.35,2.0))*0.6;
  return c;
}
vec3 lensField(vec2 p){
  float pulse=1.0+u_pulse/100.0*sin(TAU*u_t);
  vec2 c=u_orbR/100.0*vec2(cos(TAU*u_orbK*u_t),sin(TAU*u_orbK*u_t))*0.6;
  vec2 q=p-c;
  float R=max(u_size/100.0*pulse*1.25,0.05);
  float r=length(q*vec2(1.0,1.05));
  float a=atan(q.y,q.x);
  vec2 bq=q/R-vec2(0.22,0.28);
  vec3 inner=mix(u_c4,u_c1,0.18+0.55*exp(-dot(bq,bq)*2.6));
  float w=max(u_lnRim,0.02);
  float k=u_lnChroma*0.06;
  vec3 col;
  col.r=lensRamp((r/R*(1.0-k)-1.0)/w,inner).r;
  col.g=lensRamp((r/R-1.0)/w,inner).g;
  col.b=lensRamp((r/R*(1.0+k)-1.0)/w,inner).b;
  float xo=(r/R-1.0)/w;
  float rimI=0.55+0.45*cos(a-radians(u_lnAng));
  col=mix(col,mix(u_bg,col,rimI),smoothstep(0.05,0.45,xo));
  float g=exp(-max(r/R-1.0,0.0)*2.5)*u_lnGlow*rimI;
  col+=mix(u_c1,u_c2,0.6)*g*0.4*smoothstep(0.4,1.2,xo);
  if(u_lnRings>0.5){
    for(int i=0;i<6;i++){
      if(float(i)>=u_lnRings)break;
      float fi=float(i);
      vec2 oc=(vec2(hash21(vec2(fi,3.0+u_seed)),hash21(vec2(fi,7.0+u_seed)))-0.5)*R*0.16;
      float Ri=R*(1.03+0.1*fi+0.05*hash21(vec2(fi,u_seed)));
      vec2 rq=q-oc;
      float rr=length(rq);
      float fw=max(fwidth(rr),1e-5)*max(u_kScale,0.5);
      float line=1.0-smoothstep(0.0,fw*1.3,abs(rr-Ri));
      float aa=atan(rq.y,rq.x);
      float dir=mod(fi,2.0)*2.0-1.0;
      float arc=smoothstep(0.15,0.7,cos(aa-hash21(vec2(fi,11.0+u_seed))*TAU-dir*TAU*u_t));
      col+=line*arc*0.5;
    }
  }
  if(u_lnDust>0.001){
    float sc=22.0;
    vec2 dp=p*sc;
    vec2 cell=floor(dp), f=fract(dp);
    float h=hash21(cell+vec2(u_seed*0.37,u_seed*0.11));
    if(h>0.8){
      vec2 pt=0.25+0.5*vec2(hash21(cell+3.7),hash21(cell+9.1));
      pt+=0.18*vec2(sin(TAU*u_t+h*40.0),cos(TAU*u_t+h*23.0));
      float dpx=length(f-pt)/sc*min(u_res.x,u_res.y)/1.5;
      float rpx=(1.0+1.6*fract(h*13.0))*max(u_kScale,0.35);
      col+=smoothstep(rpx,rpx*0.2,dpx)*u_lnDust*0.6*(0.4+0.6*fract(h*7.0));
    }
  }
  return col;
}

/* доменний варп (wave warp X/Y + гармоніка + нахил) */
vec2 warp(vec2 uv){
  float ax=u_ampX/900.0, ay=u_ampY/900.0;
  float lx=max(u_lamX,1.0)/100.0, ly=max(u_lamY,1.0)/100.0;
  float phx=TAU*u_spdX*u_t, phy=TAU*u_spdY*u_t;
  if(ax>0.0003){
    float w=ax*sin(TAU*uv.y/lx+phx+u_skew*TAU*uv.y);
    if(u_harm>0.0)w+=ax*u_harm*0.5*sin(TAU*uv.y*2.7/lx-phx*2.0);
    uv.x+=w;
  }
  if(ay>0.0003){
    float w=ay*sin(TAU*uv.x/ly+phy+u_skew*TAU*uv.x);
    if(u_harm>0.0)w+=ay*u_harm*0.5*sin(TAU*uv.x*2.7/ly-phy*2.0);
    uv.y+=w;
  }
  return uv;
}

/* базове поле кольору (усі режими) */
vec3 field(vec2 uv){
  /* магніт курсора (як на mosta.io) — тільки в превʼю */
  if(u_mag.z>0.0005){
    vec2 w=uv/0.75-u_mag.xy;
    float b=1.0/(1.0+dot(w,w));
    uv.x+=u_mag.z*b*sin(u_rt+b)*3.0;
  }
  vec2 stS=uv/(1.5*ASP)+0.5;
  uv=warp(uv);
  if(u_mode>=6) uv-=u_off/100.0*0.75*ASP;
  float rotA=TAU*u_rotK*u_t+radians(u_angle);
  vec2 p=rot2(rotA)*uv;
  float pulse=1.0+u_pulse/100.0*sin(TAU*u_t);

  if(u_mode==5) return mostaField(p,stS);
  if(u_mode==6) return lensField(p);
  if(u_mode==7){ /* лінійний градієнт */
    float len=max(u_size,1.0)/100.0*1.5;
    float t=p.x/len+0.5;
    if(abs(u_scroll)>0.5){ float xx=t*0.5+u_scroll*u_t; t=1.0-abs(2.0*fract(xx)-1.0); }
    t=clamp(t,0.0,1.0);
    t=mix(t,smoothstep(0.0,1.0,t),clamp(u_soft/200.0,0.0,1.0));
    return pal5(t);
  }
  if(u_mode==0){ /* плями — mesh-градієнт */
    vec3 acc=vec3(0.0); float wsum=0.0;
    float softE=mix(3.2,1.2,clamp(u_soft/200.0,0.0,1.0));
    for(int i=0;i<8;i++){
      if(float(i)>=u_count)break;
      float fi=float(i);
      vec2 h=vec2(hash21(vec2(u_seed,fi*3.1+1.0)),hash21(vec2(u_seed,fi*7.7+2.0)))-0.5;
      vec2 c=h*2.0*u_spread/100.0;
      float a=TAU*u_orbK*u_t+fi*2.399;
      c+=u_orbR/100.0*vec2(cos(a),sin(a));
      float d=length(p-c)/max(u_size/100.0*pulse,0.05);
      float w=1.0/pow(d+0.06,softE*2.0);
      acc+=pickCol(i-(i/5)*5)*w; wsum+=w;
    }
    vec3 c=acc/max(wsum,1e-5);
    return mix(u_bg,c,clamp(wsum*0.35,0.0,1.0));
  }
  if(u_mode==1){ /* смуги */
    float t=fract((p.x+1.0)*0.5*max(u_count,1.0)*0.6+u_scroll*u_t);
    float sm=mix(0.0,0.5,clamp(u_soft/200.0,0.0,1.0));
    t=smoothstep(sm,1.0-sm*0.5,t);
    return pal5(t);
  }
  if(u_mode==2){ /* стрічка */
    float w=u_size/100.0*pulse;
    float t=clamp(abs(p.x)/max(w,0.02),0.0,1.0);
    return pal5(1.0-t);
  }
  if(u_mode==3){ /* кільце */
    float r=u_size/100.0*pulse;
    float t=clamp(abs(length(p)-r)/max(r*0.6,0.02),0.0,1.0);
    return mix(pal5(1.0-t),u_bg,t);
  }
  /* ШОВК — гіперболічні лінії потоку з глянцем */
  vec2 q=rot2(radians(u_fan))*(p-u_pinchPos/100.0);
  float sq=mix(0.35,1.6,u_pinch);
  float psi=q.x*q.y*sq+0.22*(1.0-u_pinch)*q.y;
  float band=u_bandFreq*psi+u_flow*u_t;
  float s=sin(TAU*band);
  float fw=fwidth(band)*TAU;
  float fade=clamp(1.0-fw*0.35,0.0,1.0);
  float body=0.5+0.5*s*fade;
  float band2=u_bandFreq*psi*0.5+u_flow*u_t;
  float slow=clamp(0.5+0.35*sin(TAU*band2)+0.25*q.y,0.0,1.0);
  vec3 col=mix(u_bg,pal5(slow),pow(body,1.45));
  float spec=pow(clamp(s,0.0,1.0),max(u_glossSharp,1.0))*u_gloss*fade;
  col+=spec*vec3(1.0);
  float heat=exp(-dot(q,q)*6.0)*u_heat;
  col=mix(col,vec3(1.0,0.97,0.93),heat*body);
  col+=heat*0.25;
  return col;
}

/* SDF скляних фігур */
float sdShape(vec2 p,float r,int t,float rot){
  p=rot2(rot)*p;
  if(t==0)return length(p)-r;
  if(t==1){
    const float k=1.73205;
    p.x=abs(p.x)-r*0.9; p.y=p.y+r*0.55;
    if(p.x+k*p.y>0.0)p=vec2(p.x-k*p.y,-k*p.x-p.y)/2.0;
    p.x-=clamp(p.x,-2.0*r,0.0);
    return -length(p)*sign(p.y);
  }
  if(t==2){
    float an=atan(p.y,p.x)+TAU/4.0;
    float seg=TAU/5.0;
    an=mod(an,seg)-seg*0.5;
    float rr=r*mix(0.5,1.0,0.5+0.5*cos(an*5.0));
    return length(p)-rr;
  }
  if(t==3) return abs(length(p)-r*0.8)-r*0.28;
  float a=atan(p.y,p.x);
  float rr=r*(0.85+0.18*sin(a*3.0+rot*2.0)+0.07*sin(a*5.0));
  return length(p)-rr;
}

void main(){
  ASP=u_res/min(u_res.x,u_res.y);
  vec2 st=gl_FragCoord.xy/u_res;
  vec2 uvFull=(st-0.5)*ASP*1.5;
  vec2 stF=st;
  if(u_mirror==1)stF.x=0.5-abs(st.x-0.5);
  if(u_mirror==2)stF.y=0.5-abs(st.y-0.5);
  if(u_mirror==3)stF=vec2(0.5)-abs(st-0.5);
  vec2 uv=(stF-0.5)*ASP*1.5;

  /* розтяг пікселів (DVTK): кожна колонка бере колір з однієї лінії */
  if(u_stAmt>0.001){
    mat2 R=rot2(radians(u_stAng));
    vec2 q=R*uv;
    float line=u_stLine/100.0*0.75;
    float j=vn1(q.x*u_stJit*0.25+3.1)*0.65+vn1(q.x*u_stJit+11.7)*0.35;
    q.y=line+(q.y-line)*(1.0-u_stAmt)+(j-0.5)*1.2*u_stAmt;
    uv=q*R;
  }

  /* рифлене скло / панелі / сходинки */
  bool fl=u_flN>0.5;
  vec2 off=vec2(0.0), nrm=vec2(1.0,0.0);
  float flK=0.0, flC=0.0;
  if(fl){
    float a=radians(u_flAng);
    nrm=vec2(cos(a),sin(a));
    vec2 tng=vec2(-nrm.y,nrm.x);
    float span=1.5*dot(abs(nrm),ASP);
    float w=span/u_flN;
    float s=dot(uvFull,nrm);
    if(u_flWave>0.001) s+=u_flWave*0.06*sin(dot(uvFull,tng)*5.0+TAU*u_t);
    flK=s/w+u_flN*0.5;
    float idx=floor(flK);
    flC=fract(flK)-0.5;
    float h=hash21(vec2(idx*1.37+2.0,u_seed+5.0));
    float o=0.0;
    if(u_flProf==0) o=-u_flRefr*flC*w*2.0;
    else if(u_flProf==1) o=-u_flRefr*(flC+0.5)*w*1.5;
    else o=-u_flRefr*(idx+0.5-u_flN*0.5)*w;
    float al=u_flShift*(h-0.5)*0.9+u_flStep*(idx-(u_flN-1.0)*0.5)*0.12;
    off=nrm*o+tng*al;
  }

  vec3 col;
  if(fl&&u_flChroma>0.001){
    float ch=u_flChroma;
    vec2 cOff=nrm*ch*0.012;
    col.r=field(uv+off*(1.0+ch*0.35)+cOff).r;
    col.g=field(uv+off).g;
    col.b=field(uv+off*(1.0-ch*0.35)-cOff).b;
  } else col=field(uv+off);

  /* скляні фігури з рефракцією */
  for(int i=0;i<4;i++){
    if(float(i)>=u_glCount)break;
    float fi=float(i);
    float ph=fi/max(u_glCount,1.0)*TAU+fi*1.7;
    float orb=0.10+0.16*hash21(vec2(fi*7.0+3.0,u_seed));
    vec2 c=vec2(cos(TAU*u_glOrbK*u_t+ph),sin(TAU*u_glOrbK*u_t+ph)*0.8)*orb*1.5;
    float r=u_glSize/100.0*(0.75+0.5*hash21(vec2(fi*13.0+5.0,u_seed)))*0.75;
    float rotS=TAU*u_glRotK*u_t+ph;
    float d=sdShape(uvFull-c,r,u_glType,rotS);
    if(d<0.0){
      vec2 ruv=(uvFull-c)/u_glRefr+c;
      col=field(ruv)*1.02;
      float edge=smoothstep(-0.035,0.0,d);
      col+=edge*u_glRim*0.7;
      vec2 hp=uvFull-c-vec2(-r*0.35,r*0.4);
      col+=exp(-dot(hp,hp)*90.0)*u_glRim*0.45;
    } else {
      col+=exp(-abs(d)*60.0)*u_glRim*0.25;
    }
  }

  /* colorama */
  if(u_colorama==1){
    float lum=dot(col,vec3(0.299,0.587,0.114));
    float v=pow(max(lum,0.0),u_gamma);
    v=(v-0.5)*u_contrast+0.5;
    v=clamp(v,0.0,0.9995);
    if(u_poster>=2.0)v=floor(v*(u_poster-1.0)+0.5)/(u_poster-1.0)*0.9995;
    float idx=fract(v*u_reps+u_phase+u_cycleK*u_t);
    col=texture(u_pal,vec2(idx,0.5)).rgb;
  }

  /* обʼєм ребер скла: тінь, блік, лінія стику */
  if(fl){
    float fw=max(fwidth(flK),1e-5)*max(u_kScale,0.5);
    float edgeD=0.5-abs(flC);
    float line=1.0-smoothstep(0.0,fw*1.4,edgeD);
    if(u_flProf==0){
      col+=u_flShade*0.10*(-2.0*flC);
      col*=1.0-u_flShade*0.22*pow(abs(2.0*flC),5.0);
      col+=u_flEdge*0.22*exp(-pow((flC+0.27)/0.06,2.0));
    } else if(u_flProf==1){
      col*=1.0-u_flShade*0.3*(flC+0.5);
      col+=u_flEdge*0.25*smoothstep(0.3,0.5,flC);
    } else {
      float shd=1.0-smoothstep(0.0,0.09,0.5+flC);
      col*=1.0-u_flShade*0.5*shd;
    }
    col+=line*u_flEdge*0.45;
  }

  /* насиченість / hue / яскравість */
  float l=dot(col,vec3(0.299,0.587,0.114));
  col=mix(vec3(l),col,u_sat);
  if(u_hue>0.5){
    float h=radians(u_hue);
    const mat3 toYIQ=mat3(0.299,0.587,0.114,0.596,-0.274,-0.322,0.211,-0.523,0.312);
    const mat3 toRGB=mat3(1.0,0.956,0.621,1.0,-0.272,-0.647,1.0,-1.106,1.703);
    vec3 yiq=col*toYIQ;
    float c2=cos(h),s2=sin(h);
    yiq.yz=mat2(c2,-s2,s2,c2)*yiq.yz;
    col=yiq*toRGB;
  }
  col*=u_bright;
  outColor=vec4(clamp(col,0.0,1.0),1.0);
}`;

  /* сепарабельний гаус із mip-префільтром (без «привидів» на великих радіусах) */
  const FS_BLUR=`#version 300 es
precision highp float;
uniform sampler2D u_src;
uniform vec2 u_size,u_step;
uniform float u_thresh,u_lod;
out vec4 o;
vec3 samp(vec2 p){
  vec3 c=textureLod(u_src,p,u_lod).rgb;
  if(u_thresh>0.001){
    float l=dot(c,vec3(0.299,0.587,0.114));
    c*=smoothstep(u_thresh,u_thresh+0.22,l);
  }
  return c;
}
void main(){
  vec2 uv=gl_FragCoord.xy/u_size;
  float w[7]=float[7](0.199471,0.176033,0.120985,0.064759,0.026995,0.008764,0.002216);

    vec2 o2=u_step*float(i);

  const FS_COMP=`#version 300 es
precision highp float;
uniform sampler2D u_scene,u_soft,u_bloom;
uniform vec2 u_size;
uniform float u_blurMix,u_dreamy,u_shineI,u_grain2,u_vig2,u_tt,u_ca,u_kScale,u_dot,u_dotSize,u_dotPaper;
uniform int u_dotMode;
uniform vec3 u_shineC,u_paper;
out vec4 o;

void main(){

  vec3 bl=texture(u_bloom,uv).rgb;

  if(u_dot>0.001){                                /* растр: halftone / LED / сітка */

    vec3 ink=u_dotMode==0?col*mix(1.0,0.8,u_dotPaper):col;

  function mkShader(type,src){

  function mkTex(w,h,mip){

    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,mip?gl.LINEAR_MIPMAP_LINEAR:gl.LINEAR);

    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

  }
  function mkFbo(t){

    gl.bindFramebuffer(gl.FRAMEBUFFER,f);

  function rebuildTargets(){

  /* палітра-текстура */
  const palTex=gl.createTexture();
  function buildPalTexture(){
    const stops = P.palette==="src" ? [P.bgColor,...P.colors] : PALETTES[P.palette];
    const c=document.createElement("canvas"); c.width=256; c.height=1;
    const x=c.getContext("2d");

    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);

    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

  let W=0,H=0,kScale=1;
  let playing=true,t0=performance.now()/1000,tPause=0,busyExport=false;

  function ratioWH(r){const[a,b]=(r||P.ratio).split(":").map(Number);return a/b;}
  function sizeFor(base){const r=ratioWH();let w,h;if(r>=1){w=base;h=Math.round(w/r);}else{h=base;w=Math.round(h*r);}return[w-w%2,h-h%2];}
  function exportLong(){return Math.min(4096,P.exLong>0?P.exLong:P.res*P.exScale);}
  function setSize(w,h){

  function resize(base){

  function blurPass(srcTex,srcW,dstFbo,dw,dh,radius,dirX,dirY,thresh){

  function buildPanes(){
    Object.entries(PANES).forEach(([pane,groups])=>{
      const host=document.querySelector(`[data-pane="${pane}"]`);
      groups.forEach(g=>{
        const grp=document.createElement("div");grp.className="group";
        if(g.modes)MODE_EL.push([grp,g.modes]);
        if(g.h){const h=document.createElement("h2");h.textContent=g.h;grp.appendChild(h);}
        g.items.forEach(it=>{
          let el;
          if(it.t==="range")el=mkRange(it);
          else if(it.t==="seg")el=mkSeg(it);
          else if(it.t==="select")el=mkSelect(it);
          else if(it.t==="color")el=mkColor(it);
          else el=CUSTOMS[it.id]();
          if(it.modes)MODE_EL.push([el,it.modes]);
          grp.appendChild(el);
        });
        if(g.note){const n=document.createElement("div");n.className="note";n.textContent=g.note;grp.appendChild(n);}
        host.appendChild(grp);
      });
    });
  }
  function updateModeVis(){
    MODE_EL.forEach(([el,m])=>{el.style.display=m.includes(P.mode)?"":"none";});
    if(CTRL.colors)CTRL.colors.sync();
  }
  function syncColoramaBox(){const b=$("coloramaBox");if(b)b.style.opacity=P.colorama?1:0.35;}

  const TILES=[];

    const host=$("presetGroups");
    PRESET_GROUPS.forEach((g,gi)=>{
      const h=document.createElement("h2");h.textContent=g.title;if(gi)h.style.marginTop="16px";host.appendChild(h);
      const box=document.createElement("div");box.className="presets thumbs";

        const cv=document.createElement("canvas");cv.width=192;cv.height=120;

  function renderThumbs(){
    const keep=JSON.stringify(P);
    busyExport=true;
    setSize(192,120);
    TILES.forEach(t=>{
      Object.assign(P,presetParams(t.name));
      buildPalTexture();
      renderFrame(0.3,false);
      t.cv.getContext("2d").drawImage(out,0,0,192,120);
    });

  function clearStyleActive(){TILES.forEach(t=>t.el.classList.remove("active"));}
  function markPreset(name){TILES.forEach(t=>t.el.classList.toggle("active",t.name===name));}
  function keepOutput(p){OUT_KEYS.forEach(k=>p[k]=P[k]);return p;}
  function applyPreset(name){
    const p=presetParams(name);if(!p)return;
    const own=PRESET_GROUPS.map(g=>g.list[name]).find(Boolean)||{};
    Object.assign(P,keepOutput(p));
    if("seed" in own)P.seed=own.seed;
    syncUI();buildPalTexture();resize();markPreset(name);
    try{history.replaceState(null,"","#"+slug(name));}catch(e){}
  }

  /* ================= генератор ================= */
  const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
  const r2=v=>Math.round(v*100)/100;
  function generate(){
    const p=JSON.parse(JSON.stringify(NEW_BASE));
    const sw=SWATCHES[pick(Object.keys(SWATCHES))];
    p.colors=sw.colors.slice();p.bgColor=sw.bg;
    const dark=lumHex(sw.bg)<0.35, x=Math.random();
    p.mode=x<0.42?5:x<0.58?7:x<0.76?0:x<0.88?6:1;
    if(p.mode===5){p.mScale=r2(rnd(2,4.5));p.mStretch=r2(rnd(4,12));p.mDisp=r2(rnd(0.2,0.6));p.mCycles=Math.round(rnd(6,14));
      p.mMask=pick([0,1,2,3,4]);p.mC3=Math.random()<0.4?r2(rnd(0.3,0.9)):0;p.angle=Math.round(rnd(-25,25));p.mBlend=dark?1:0;}
    if(p.mode===7){p.size=Math.round(rnd(40,110));p.angle=Math.round(rnd(-40,40));p.offX=Math.round(rnd(-25,25));p.soft=Math.round(rnd(60,200));p.ampY=Math.round(rnd(0,25));}
    if(p.mode===0){p.count=Math.round(rnd(4,7));p.size=Math.round(rnd(35,60));p.spread=Math.round(rnd(30,55));p.soft=Math.round(rnd(80,180));p.orbR=Math.round(rnd(6,18));}
    if(p.mode===6){p.size=Math.round(rnd(45,72));p.lnRim=r2(rnd(0.12,0.35));p.lnChroma=r2(rnd(0.3,1));p.lnRings=Math.round(rnd(0,4));
      p.lnDust=r2(rnd(0,0.7));p.lnAng=Math.round(rnd(-60,60));if(!dark)p.bgColor="#050a24";}
    if(p.mode===1){p.count=Math.round(rnd(1,3));p.soft=Math.round(rnd(100,190));p.scroll=pick([-1,1]);}
    const o=Math.random();
    if(o<0.3){p.flN=Math.round(rnd(6,22));p.flProf=0;p.flRefr=r2(rnd(0.3,0.9));p.flShade=r2(rnd(0.2,0.55));p.flEdge=r2(rnd(0.1,0.35));
      p.flChroma=Math.random()<0.5?r2(rnd(0.1,0.4)):0;p.flAng=Math.random()<0.8?0:Math.round(rnd(-30,30));}
    else if(o<0.45){p.flN=Math.round(rnd(3,8));p.flProf=2;p.flAng=pick([0,90]);p.flRefr=p.flAng===0?r2(rnd(0.5,0.9)):0;
      p.flShift=p.flAng===90?r2(rnd(0.4,1)):0;p.flStep=Math.random()<0.4?r2(rnd(-1,1)):0;p.flShade=r2(rnd(0.15,0.35));p.flEdge=r2(rnd(0.05,0.2));}
    else if(o<0.55){p.stAmt=r2(rnd(0.75,0.95));p.stJit=Math.round(rnd(30,90));}
    if(Math.random()<0.12){p.dot=r2(rnd(0.5,0.9));p.dotSize=Math.round(rnd(4,7));}
    p.grain=r2(rnd(0.03,0.1));
    Object.assign(P,keepOutput(p));
    P.seed=Math.floor(Math.random()*997)+1;
    clearStyleActive();syncUI();buildPalTexture();resize();
  }

  /* ================= exports ================= */
  function status(m,r){$("statusTxt").textContent=m||"Готово";$("statusDot").classList.toggle("rec",!!r);}
  function downloadBlob(b,n){const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
  async function withExportSize(fn){busyExport=true;resize(exportLong());try{await fn();}finally{resize();busyExport=false;status("");}}
  function exportStill(t,e,q){withExportSize(async()=>{status("Рендер…");await new Promise(r=>setTimeout(r,20));renderFrame(loopPhase(),false);
    await new Promise(res=>out.toBlob(b=>{if(b)downloadBlob(b,"flux."+e);res();},t,q));});}

  function bindExports(){
    $("exPng").addEventListener("click",()=>exportStill("image/png","png"));
    $("exJpg").addEventListener("click",()=>exportStill("image/jpeg","jpg",0.92));
    $("exWebp").addEventListener("click",()=>exportStill("image/webp","webp",0.95));
    let mp4Busy=false;
    $("exMp4").addEventListener("click",async()=>{
      if(mp4Busy){mp4Busy=false;return;}
      if(!("VideoEncoder" in window)||typeof Mp4Muxer==="undefined"){alert("Цей браузер не підтримує локальне H.264-кодування (WebCodecs).");return;}
      mp4Busy=true;$("mp4Label").textContent="■ Скасувати";
      await withExportSize(async()=>{
        const fps=P.fps,total=Math.round(P.dur*fps);let encErr=null;
        const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:"avc",width:W,height:H},fastStart:"in-memory"});
        const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{encErr=e;}});
        enc.configure({codec:W*H>1500000?"avc1.640033":"avc1.640028",width:W,height:H,bitrate:P.bitrate*1e6,framerate:fps});
        const loops=Math.max(1,Math.round(P.dur/P.period));
        for(let f=0;f<total;f++){
          if(!mp4Busy||encErr)break;
          renderFrame(((f/fps)/(P.dur/loops))%1,false);
          const fr=new VideoFrame(out,{timestamp:f*1e6/fps,duration:1e6/fps});
          enc.encode(fr,{keyFrame:f%(fps*2)===0});fr.close();
          if(enc.encodeQueueSize>4)await new Promise(r=>setTimeout(r,12));
          if(f%3===0){status(`Рендер ${Math.round((f+1)/total*100)}%`,true);await new Promise(r=>setTimeout(r,0));}
        }
        if(mp4Busy&&!encErr){status("Кодування…",true);
          await Promise.race([enc.flush(),new Promise(r=>setTimeout(r,20000))]);muxer.finalize();
          downloadBlob(new Blob([muxer.target.buffer],{type:"video/mp4"}),"flux.mp4");}
        try{enc.close();}catch(e){}
        if(encErr)alert("Помилка кодування MP4: "+(encErr.message||encErr));
      });
      mp4Busy=false;$("mp4Label").textContent="MP4 (луп)";
    });
    let webmRec=null;
    $("exWebm").addEventListener("click",()=>{
      if(webmRec){webmRec.stop();return;}
      if(!out.captureStream||!window.MediaRecorder){alert("Запис недоступний у цьому браузері.");return;}
      const chunks=[];const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")?"video/webm;codecs=vp9":"video/webm";
      try{webmRec=new MediaRecorder(out.captureStream(P.fps),{mimeType:mime,videoBitsPerSecond:P.bitrate*1e6});}
      catch(e){alert("Запис недоступний у цьому браузері.");webmRec=null;return;}
      webmRec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      webmRec.onstop=()=>{if(chunks.length)downloadBlob(new Blob(chunks,{type:"video/webm"}),"flux.webm");webmRec=null;$("webmLabel").textContent="WebM";status("");};
      webmRec.start(200);$("webmLabel").textContent="■ Стоп";status("REC",true);
      setTimeout(()=>{if(webmRec)webmRec.stop();},P.dur*1000);
    });
    $("reset").addEventListener("click",()=>{
      Object.assign(P,JSON.parse(JSON.stringify(DEFAULTS)));
      syncUI();buildPalTexture();resize();markPreset("Mosta Sky");
    });
  }

  $("btnRand").addEventListener("click",generate);
  $("btnShuffle").addEventListener("click",()=>{P.seed=(P.seed*7+3)%1000+1;});

  /* ================= стан: автозбереження ================= */
  const LS="fluxStudioV2";
  function restore(){
    try{
      const s=JSON.parse(localStorage.getItem(LS)||"null");if(!s)return false;
      Object.keys(DEFAULTS).forEach(k=>{if(k in s&&typeof s[k]===typeof DEFAULTS[k])P[k]=s[k];});
      if(!Array.isArray(P.colors)||P.colors.length!==5)P.colors=DEFAULTS.colors.slice();
      return true;
    }catch(e){return false;}
  }
  let lastSaved="";
  setInterval(()=>{const s=JSON.stringify(P);if(s!==lastSaved){lastSaved=s;try{localStorage.setItem(LS,s);}catch(e){}}},1200);

  /* ================= boot ================= */
  buildPresetTiles();
  buildPanes();
  bindExports();
  const fromHash=(location.hash||"").slice(1);
  const hashPreset=fromHash&&PRESET_GROUPS.map(g=>Object.keys(g.list)).flat().find(n=>slug(n)===fromHash);
  const restored=!hashPreset&&restore();
  buildPalTexture();resize();
  renderThumbs();
  if(hashPreset)applyPreset(hashPreset);
  else{syncUI();if(!restored)markPreset("Mosta Sky");}
  lastSaved=JSON.stringify(P);
  window.addEventListener("hashchange",()=>{
    const h=(location.hash||"").slice(1);
    const n=PRESET_GROUPS.map(g=>Object.keys(g.list)).flat().find(x=>slug(x)===h);
    if(n)applyPreset(n);
  });
  window.FLUX={P,renderFrame,resize,applyPreset,syncUI,buildPalTexture,setSize,get W(){return W;},get H(){return H;}}; /* для тестів */
  tick();
})();
</script>
<script src="postfx.js"></script>
<script src="i18n.js"></script>
</body>
</html>
